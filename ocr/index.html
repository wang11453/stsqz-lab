<style>
body {
    background: #050505;
    font-family: Poppins, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #fafafa;
}
::selection { background: rgba(255, 255, 255, 0.9); color: #050505; }
::-webkit-scrollbar-track { background: #050505; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border: 2px solid #050505; }
.bg-glow { background: radial-gradient(ellipse 70% 42% at 50% 108%, rgba(255, 255, 255, 0.08), transparent 70%); }
.lab-header { background: rgba(5, 5, 5, 0.78); border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
.lab-logo { color: #fafafa; }
.lab-nav a { color: rgba(255, 255, 255, 0.55); }
.lab-nav a:hover, .lab-nav a.active { color: #fff; background: rgba(255, 255, 255, 0.07); }
.lab-footer { border-top: 1px solid rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.35); }
#labBoot { background: #050505; }
#labBoot .boot-rings i:nth-child(1) { border-color: rgba(255, 255, 255, 0.12); border-top-color: rgba(255, 255, 255, 0.85); }
#labBoot .boot-rings i:nth-child(2) { border-color: rgba(255, 255, 255, 0.08); border-bottom-color: rgba(255, 255, 255, 0.5); }
#labBoot .boot-dots i { background: rgba(255, 255, 255, 0.5); }
#labBoot .boot-bar i { background: #fff; }
#labBoot .boot-domain { color: rgba(255, 255, 255, 0.55); text-shadow: none; }
#labBoot .boot-pct { color: rgba(255, 255, 255, 0.8); }
.back-line a { color: rgba(255, 255, 255, 0.45); }
.back-line a:hover { color: #fff; }
.tool-wrap { grid-template-columns: 380px 1fr; }
.panel {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 40%, rgba(255, 255, 255, 0.015) 100%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 28px;
    padding: 30px;
}
.page-title h1 { font-size: 22px; font-weight: 500; color: #fff; letter-spacing: -0.01em; }
.page-title p { color: rgba(255, 255, 255, 0.5); font-weight: 300; }
.dropzone {
    border: 1.5px dashed rgba(255, 255, 255, 0.18);
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.02);
}
.dropzone:hover, .dropzone.drag { border-color: rgba(255, 255, 255, 0.45); background: rgba(255, 255, 255, 0.05); }
.dropzone .ic { color: rgba(255, 255, 255, 0.5); }
.dropzone:hover .ic, .dropzone.drag .ic { color: #fff; }
.dz-main { color: #fff; }
.dz-sub { color: rgba(255, 255, 255, 0.4); }
.file-chip { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.1); }
.file-chip .ic { color: rgba(255, 255, 255, 0.75); }
.fc-dur { color: rgba(255, 255, 255, 0.4); }
.btn-primary {
    background: #fff; color: #050505; font-weight: 500;
    border-radius: 999px; border: none;
    transition: transform 0.2s ease;
}
.btn-primary:hover:not(:disabled) { transform: scale(1.02); background: #fff; }
.btn-primary:active { transform: scale(0.98); }
.btn-ghost {
    border: 1px solid rgba(255, 255, 255, 0.15); color: rgba(255, 255, 255, 0.8);
    border-radius: 999px; background: transparent; font-weight: 400;
}
.btn-ghost:hover:not(:disabled) { border-color: rgba(255, 255, 255, 0.3); color: #fff; }
.status-line { color: rgba(255, 255, 255, 0.55); }
.status-line.ok { color: rgba(255, 255, 255, 0.85); }
.status-line.err { color: #ff9d9d; }
.status-line .bar { background: rgba(255, 255, 255, 0.08); }
.status-line .bar i { background: #fff; }
.hint { color: rgba(255, 255, 255, 0.35); font-weight: 300; }
.result-head h2 { font-weight: 500; color: #fff; }
.res-actions button { border-color: rgba(255, 255, 255, 0.14); color: rgba(255, 255, 255, 0.7); border-radius: 999px; }
.res-actions button:hover:not(:disabled) { border-color: rgba(255, 255, 255, 0.35); color: #fff; }
.empty { color: rgba(255, 255, 255, 0.3); }
.empty .ic { color: rgba(255, 255, 255, 0.14); }
.ocr-img-wrap { position: relative; margin-bottom: 16px; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; overflow: hidden; background: #0a0a0a; }
.ocr-img-wrap img, .ocr-img-wrap canvas { display: block; width: 100%; height: auto; }
.ocr-img-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.ocr-text {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 16px 18px;
    min-height: 120px;
    max-height: 320px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-all;
    font-size: 14px;
    line-height: 1.9;
    color: rgba(255, 255, 255, 0.88);
}
.ocr-log { margin-top: 12px; color: rgba(255, 255, 255, 0.3); font-size: 11.5px; line-height: 1.7; max-height: 100px; overflow: auto; }
@media (max-width: 640px) {
    .panel { padding: 20px; border-radius: 22px; }
}
</style>

<div class="tool-wrap">
    <section class="panel">
        <div class="page-title">
            <h1>文字识别</h1>
            <p>把图片里的文字变成可复制的文本，全程在本地完成。</p>
        </div>

        <div class="dropzone" id="dropzone">
            <svg aria-hidden="true" class="ic"><use href="#i-upload"/></svg>
            <div class="dz-main">拖入图片，或点击选择</div>
            <div class="dz-sub">支持 png jpg webp bmp，清晰印刷体效果最佳</div>
        </div>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/bmp" hidden>

        <div class="file-chip" id="fileChip">
            <svg aria-hidden="true" class="ic"><use href="#i-scan"/></svg>
            <span class="fc-name" id="fcName"></span><span class="fc-dur" id="fcDur"></span>
            <span class="fc-x" id="fcX" title="移除"><svg aria-hidden="true" class="ic"><use href="#i-close"/></svg></span>
        </div>

        <button class="btn-primary" id="runBtn" disabled><svg aria-hidden="true" class="ic"><use href="#i-scan"/></svg>开始识别</button>

        <p class="status-line" id="statusLine"><span id="statusText">选文件后开始</span>
            <span class="bar"><i id="barFill"></i></span>
        </p>
        <p class="hint">第一次使用会下载约 15MB 模型，之后自动缓存，无需重复下载。</p>
        <p class="hint">支持中英文混排；手写字和严重倾斜的照片效果会打折。</p>
    </section>

    <section class="panel">
        <div class="result-head">
            <h2>识别结果</h2>
            <div class="res-actions">
                <button id="btnCopy" disabled><svg aria-hidden="true" class="ic"><use href="#i-copy"/></svg>复制</button>
                <button id="btnTxt" disabled><svg aria-hidden="true" class="ic"><use href="#i-download"/></svg>TXT</button>
            </div>
        </div>
        <div class="empty" id="emptyState">
            <svg aria-hidden="true" class="ic"><use href="#i-file"/></svg>
            识别结果会显示在这里
        </div>
        <div id="resultBody" style="display:none">
            <div class="ocr-img-wrap">
                <img id="imgPrev" alt="">
                <canvas id="boxesCanvas"></canvas>
            </div>
            <div class="ocr-text" id="textBox"></div>
        </div>
        <div class="ocr-log" id="ocrLog"></div>
    </section>
</div>
